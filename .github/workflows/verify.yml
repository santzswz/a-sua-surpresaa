name: Verificar a surpresa

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: node --check assets/js/app.js
      - run: node --check assets/js/audio-controller.js
      - run: node --check assets/js/details.js
      - run: node --check assets/js/chapters.js
      - run: node --check assets/js/navigation.js
      - run: node --test tests/*.test.cjs
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
